[project] 
name = "capstone-project" 
version = "0.1.0" 
description = "" 
authors = [ 
    {name = "SouravKumar",email = "Sourav123@gmai.com"} 
] 
requires-python = ">=3.12,<4.0" 
dependencies = [ 
    "python-dotenv (>=1.2.2,<2.0.0)", 
    "openai (>=2.43.0,<3.0.0)", 
    "chromadb (>=1.5.9,<2.0.0)", 
    "rich (>=15.0.0,<16.0.0)", 
    "pydantic (>=2.13.4,<3.0.0)", 
    "pyyaml (>=6.0.3,<7.0.0)", 
    "langchain (>=1.4.3,<2.0.0) ; python_version >= \"3.12\" and python_full_version < \"4.0.0\"", 
    "langchain-openai (>=1.6.7,<2.0.0) ; python_version >= \"3.12\" and python_full_version < \"4.0.0\"", 
    "langchain-anthropic (>=1.7.5,<2.0.0) ; python_version >= \"3.12\" and python_full_version < \"4.0.0\"", 
    "langchain-huggingface (>=1.2.2,<2.0.0) ; python_version >= \"3.12\" and python_full_version < \"4.0.0\"", 
    "langchain-groq (>=1.1.3,<2.0.0)", 
    "tree-sitter (==0.26.0)", 
    "tree-sitter-language-pack (==1.10.2)", 
    "sentence-transformers (>=6.1.0,<7.0.0)", 
    "langchain-qdrant (>=1.1.0,<2.0.0)", 
    "fastembed (>=0.8.1,<0.9.0)", 
    "langgraph-checkpoint-sqlite (>=3.1.1,<4.0.0)", 
    "langchain-mcp-adapters (>=0.3.2,<0.4.0)" 
] 
 
[tool.poetry] 
packages = [{include = "My_claude"}] 
 
[tool.poetry.scripts] 
My_claude = "My_claude.main:run" 
 
[build-system] 
requires = ["poetry-core>=2.0.0,<3.0.0"] 
build-backend = "poetry.core.masonry.api" 